name: Enable Pages

on:
  workflow_dispatch:

permissions: write-all

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Check token scopes and enable Pages
        run: |
          echo "=== Token scopes ==="
          curl -sI -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/user | grep -i "x-oauth-scopes" || true
          echo "=== Repo actions permissions ==="
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/permissions || true
          echo "=== Try enable Pages (branch source) ==="
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"master","path":"/"}}' || true
          echo "=== Get Pages ==="
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages
